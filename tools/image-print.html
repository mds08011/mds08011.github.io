<!DOCTYPE html>
<html lang="en" class="js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Print Layout | Tools | MDS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" type="text/css">
    <link rel="stylesheet" href="/style.css" type="text/css">

    <script data-goatcounter="https://mds08011.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
    <script type="module">
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
    </script>
    <style>
        .controls {
            display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
            margin-bottom: 20px; padding: 16px; background: white;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 12px; color: #666; font-weight: 500; }
        .preview-container {
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px; overflow: auto;
        }
        .page {
            background: white; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: grid; gap: 8px; padding: 8px;
        }
        .page.portrait { width: 210mm; height: 297mm; max-width: 100%; }
        .page.landscape { width: 297mm; height: 210mm; max-width: 100%; }
        .photo-cell {
            position: relative; overflow: hidden; background: #f5f5f5;
            display: flex; align-items: center; justify-content: center;
            border: 1px dashed #ddd;
        }
        .photo-cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .photo-cell.cover img { width: 100%; height: 100%; object-fit: cover; }
        .remove-btn {
            position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
            border-radius: 50%; background: rgba(0,0,0,0.6); color: white;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .empty-state {
            text-align: center; padding: 60px 20px; color: #999; cursor: pointer;
            grid-column: 1 / -1; grid-row: 1 / -1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .photo-count { font-size: 14px; color: #666; margin-left: auto; }
        @media print {
            body { padding: 0; margin: 0; background: white; }
            header, footer, h1, .controls, .preview-label { display: none !important; }
            .preview-container { padding: 0; box-shadow: none; background: none; }
            .page { box-shadow: none; margin: 0; padding: 0; width: 100%; height: 100%; page-break-after: avoid; }
            .photo-cell { border: none; }
            .remove-btn { display: none !important; }
        }
        @page { margin: 0; }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul style="display: flex; list-style: none; padding: 0; gap: 1rem; margin: 0;">
                <li><a href="/">Home</a></li>
                <li><a href="/blog/">Blog</a></li>
                <li><a href="/tools/">Tools</a></li>
                <li><a href="/contact/">Contact</a></li>
                <li><a href="https://github.com/mds08011/mds08011.github.io">GitHub</a></li>
            </ul>
            <hr>
        </nav>
    </header>
    <main>
        <h1>Photo Print Layout</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Add photos</label>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            <div class="control-group">
                <label>Orientation</label>
                <select id="orientation">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>
            <div class="control-group">
                <label>Columns</label>
                <select id="columns">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="control-group">
                <label>Rows</label>
                <select id="rows">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="control-group">
                <label>Fit mode</label>
                <select id="fitMode">
                    <option value="contain">Fit (show all)</option>
                    <option value="cover">Fill (crop)</option>
                </select>
            </div>
            
            <button id="clearBtn">Clear</button>
            <button id="printBtn">Print</button>
            <div class="photo-count" id="photoCount">0 photos</div>
        </div>
        
        <div class="preview-container">
            <div class="page portrait" id="page">
                <div class="empty-state" id="emptyState">
                    <p>Add photos to get started</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        const fileInput = document.getElementById('fileInput');
        const orientation = document.getElementById('orientation');
        const columns = document.getElementById('columns');
        const rows = document.getElementById('rows');
        const fitMode = document.getElementById('fitMode');
        const clearBtn = document.getElementById('clearBtn');
        const printBtn = document.getElementById('printBtn');
        const page = document.getElementById('page');
        const emptyState = document.getElementById('emptyState');
        const photoCount = document.getElementById('photoCount');

        let photos = [];

        function updatePhotoCount() {
            const count = photos.length;
            photoCount.textContent = `${count} photo${count !== 1 ? 's' : ''}`;
        }

        function updateGrid() {
            const cols = parseInt(columns.value);
            const numRows = parseInt(rows.value);
            const orient = orientation.value;
            const fit = fitMode.value;
            
            page.className = `page ${orient}`;
            page.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            page.style.gridTemplateRows = `repeat(${numRows}, 1fr)`;
            
            page.innerHTML = '';
            
            const totalCells = cols * numRows;
            
            if (photos.length === 0) {
                const emptyClone = emptyState.cloneNode(true);
                emptyClone.addEventListener('click', () => fileInput.click());
                page.appendChild(emptyClone);
                return;
            }
            
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = `photo-cell ${fit === 'cover' ? 'cover' : ''}`;
                
                if (photos[i]) {
                    const img = document.createElement('img');
                    img.src = photos[i];
                    cell.appendChild(img);
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.innerHTML = '×';
                    removeBtn.addEventListener('click', () => removePhoto(i));
                    cell.appendChild(removeBtn);
                }
                page.appendChild(cell);
            }
            updatePrintStyles();
        }

        function updatePrintStyles() {
            let printStyle = document.getElementById('dynamic-print-style');
            if (!printStyle) {
                printStyle = document.createElement('style');
                printStyle.id = 'dynamic-print-style';
                document.head.appendChild(printStyle);
            }
            const orient = orientation.value;
            const cols = parseInt(columns.value);
            const numRows = parseInt(rows.value);
            
            printStyle.textContent = `
                @media print {
                    @page { size: A4 ${orient}; margin: 0; }
                    .page {
                        width: 100vw; height: 100vh; display: grid;
                        grid-template-columns: repeat(${cols}, 1fr);
                        grid-template-rows: repeat(${numRows}, 1fr);
                        gap: 2mm; padding: 2mm;
                    }
                }
            `;
        }

        function removePhoto(index) {
            photos.splice(index, 1);
            updatePhotoCount();
            updateGrid();
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    photos.push(e.target.result);
                    updatePhotoCount();
                    updateGrid();
                };
                reader.readAsDataURL(file);
            });
        }

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        orientation.addEventListener('change', updateGrid);
        columns.addEventListener('change', updateGrid);
        rows.addEventListener('change', updateGrid);
        fitMode.addEventListener('change', updateGrid);

        clearBtn.addEventListener('click', () => {
            photos = [];
            updatePhotoCount();
            updateGrid();
        });

        printBtn.addEventListener('click', () => window.print());

        document.body.addEventListener('dragover', (e) => {
            e.preventDefault(); e.stopPropagation();
        });

        document.body.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation();
            handleFiles(e.dataTransfer.files);
        });

        updateGrid();
    </script>
    <footer>
        <hr>
        <p><sub>Minimalist, privacy-conscious analytics are implemented for this site and <a href="https://mds08011.goatcounter.com">publicly viewable</a>.<br>
        This website's source code is open and available on <a href="https://github.com/mds08011/mds08011.github.io">GitHub</a>.</sub></p>
    </footer>
</body>
</html>
